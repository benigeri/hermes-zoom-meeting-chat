name: zoom_meeting_chat-platform
label: Zoom Meeting Chat
kind: platform
version: 0.5.2
description: Calendar-aware paired DM, public @Hio, and Hotel India / Hotel Hotel voice-command Zoom platform for Hermes, backed by Recall.ai.
author: Paul Benigeri
license: MIT
requires_env:
  - name: RECALL_API_KEY
    description: Recall.ai API key
    password: true
  - name: RECALL_WEBHOOK_SECRET
    description: Recall.ai workspace webhook signing secret (whsec_...)
    password: true
provides_tools:
  - zoom_chat_join
  - zoom_chat_join_calendar_event
  - zoom_chat_leave
  - zoom_chat_status
